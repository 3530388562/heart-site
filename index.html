          const tl = r * 6 * fade;
          const g2 = ctx.createLinearGradient(st.x, st.y, st.x, st.y + tl);
          g2.addColorStop(0, `rgba(236,243,255,${a * 0.85})`);
          g2.addColorStop(1, 'rgba(236,243,255,0)');
          ctx.fillStyle = g2;
          ctx.beginPath(); ctx.moveTo(st.x - r * 0.32, st.y); ctx.lineTo(st.x + r * 0.32, st.y);
          ctx.lineTo(st.x, st.y + tl); ctx.closePath(); ctx.fill();
        }
        ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.rot);
        if (ss === 0 || ss === 1) {                 // 四角尖星（无外圈光晕）
          const k = r * 0.2;                        // 内凹更收 → 四角更尖、更利落
          ctx.fillStyle = `rgba(${ss === 1 ? '255,255,255' : '238,244,255'},${a})`;
          ctx.beginPath();
          ctx.moveTo(0, -r); ctx.lineTo(k, -k); ctx.lineTo(r, 0); ctx.lineTo(k, k);
          ctx.lineTo(0, r); ctx.lineTo(-k, k); ctx.lineTo(-r, 0); ctx.lineTo(-k, -k);
          ctx.closePath(); ctx.fill();
          if (ss === 1) {                           // 银星(A无晕)：明亮中心核，更「闪耀」
            ctx.fillStyle = `rgba(255,255,255,${Math.min(1, a * 1.25)})`;
            ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, 6.283); ctx.fill();
          }
        } else if (ss === 2) {                      // 银钻切面：菱形主石 + 顶部高光切面
          ctx.fillStyle = `rgba(228,238,255,${a})`;
          ctx.beginPath();                          // 整颗菱形
          ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.6, 0);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = `rgba(255,255,255,${Math.min(1, a * 1.1)})`;   // 顶部高光
          ctx.beginPath();
          ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
        } else {                                     // 银流星：四角星核（拖尾已在上方画）
          const k = r * 0.2;
          ctx.fillStyle = `rgba(236,243,255,${a})`;
          ctx.beginPath();
          ctx.moveTo(0, -r); ctx.lineTo(k, -k); ctx.lineTo(r, 0); ctx.lineTo(k, k);
          ctx.lineTo(0, r); ctx.lineTo(-k, k); ctx.lineTo(-r, 0); ctx.lineTo(-k, -k);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
    }


    ctx.globalCompositeOperation = 'lighter';   // 轻点迸发火星 / 划痕 用叠加发光
    // 轻点迸发的一簇粒子：颗粒=小方点+柔光晕（lighter 叠加）；球型=清晰实心球+高光+窄辉光
    // 球型不再复用 28px 柔光贴图：贴图缩到几像素后渐变被插值抹平、边界消失，叠 lighter 会糊成白雾。
    const sparkSphere = (PARTICLE_STYLE === 'sphere');
    if (sparkSphere) ctx.globalCompositeOperation = 'source-over';   // 正常混合：球体不发白、边界清晰
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life += dt; p.vy += 0.055 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const fade = 1 - p.life / p.maxLife;
      if (fade <= 0 || p.y > H + 30) { sparks.splice(i, 1); continue; }
      const a = Math.min(1, fade * 1.4);
      if (sparkSphere) {
        const R = p.size * 2.5;                 // 实心球半径：约为颗粒实心点的 2.5 倍，明显是「球」
        const hlx = p.x - R * 0.28, hly = p.y - R * 0.30;
        ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a * 0.14})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, R * 1.35, 0, 6.283); ctx.fill();   // 一圈很窄的淡辉光
        ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 6.283); ctx.fill();           // 实心球：锐利边界
        const hr = Math.round(p.r + (255 - p.r) * 0.55),
              hg = Math.round(p.g + (255 - p.g) * 0.55),
              hb = Math.round(p.b + (255 - p.b) * 0.55);
        ctx.fillStyle = `rgba(${hr},${hg},${hb},${a * 0.85})`;
        ctx.beginPath(); ctx.arc(hlx, hly, R * 0.42, 0, 6.283); ctx.fill();    // 左上高光：立体感
        continue;
      }
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a * 0.16})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';   // 恢复，后续绘制不受影响

    // 划痕：细亮线（无外晕），长度随划动距离等比例增加，随时间渐隐
    const SLIFE = 600;    // 划痕寿命(ms)：抬手后 0.6s 内快速渐隐
    if (stroke) {
      const a = Math.max(0, 1 - (now - stroke.lastT) / SLIFE);
      if (a <= 0 && !swiping) { stroke = null; }
      else {
        // 笔直划痕：只连「起点 → 当前手指位置」，忽略手指抖动，永远是直线
        const pdx = stroke.x - stroke.x0, pdy = stroke.y - stroke.y0;
        // 位移太短（点击抖动）不画划痕，避免点一下闪出一道痕迹
        if (Math.sqrt(pdx * pdx + pdy * pdy) >= MIN_CUT) {
          ctx.globalCompositeOperation = 'source-over'; // 普通绘制，避免叠加累积成白色
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.strokeStyle = `rgba(255,190,220,${a * 0.42})`;   // 很淡的柔粉，不刺眼
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(stroke.x0, stroke.y0);
          ctx.lineTo(stroke.x, stroke.y);
          ctx.stroke();
        }
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    // 烟花层（纯色切黑 → 夜空模式）：透明离屏层合成到最前，不黑屏、不影响爱心
    // 烟花按设备原生刷新率实时播放：fwDt 直接采用真实帧间隔 dt
    if (fwActive) { fwDt = dt; fwUpdateDraw(); }   // 烟花层已是独立 DOM 叠加层，无需逐帧全屏合成
    requestAnimationFrame(loop);
  }


  // 控件集合只查一次，后续点击复用
  const modeBtns = document.querySelectorAll('#panel button[data-m]');
  const shapeBtns = document.querySelectorAll('#panel button[data-s]');
  const styleBtns = document.querySelectorAll('#panel button[data-style]');
  const sandBtns = document.querySelectorAll('#panel button[data-sand]');
  const poseBtns = document.querySelectorAll('#panel button[data-pose]');
  const starBtns = document.querySelectorAll('#panel button[data-star]');
  const dropdowns = document.querySelectorAll('#panel .dropdown');
  const beatBtn = document.querySelector('#panel button[data-b="beat"]');
  const colTop = document.getElementById('colTop'), colBot = document.getElementById('colBot');
  const colSolid = document.getElementById('colSolid'), solidBtn = document.getElementById('solidBtn');
  const colorbox = document.getElementById('colorbox');

  // 左上角切换成型方式：仅记录「待生效」方式，下一次切割→聚合时套用
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      pendingMode = btn.dataset.m;
      modeBtns.forEach(b => b.classList.toggle('on', b.dataset.m === (pendingMode ?? FORMATION)));
    });
  });
  beatBtn.addEventListener('click', e => {
    BEAT = !BEAT;
    e.currentTarget.classList.toggle('on', BEAT);
  });
  // 形状开关：已成型时即时 morph；否则等下一次切割→聚合
  shapeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      pendingShape = btn.dataset.s;
      if (heartReady && !scattered) applyShapeImmediate();
      const cur = pendingShape !== null ? pendingShape : SHAPE;
      shapeBtns.forEach(b => b.classList.toggle('on', b.dataset.s === cur));
    });
  });

  function applyColorNow() {
    colorTouched = true;
    COL_TOP = hex2rgb(colTop.value); COL_BOT = hex2rgb(colBot.value);
    if (SOLID) COL_SOLID = hex2rgb(colSolid.value);
    for (const p of heart) { const c = shapeColor(p.hy, p.idx); p.r = c.r; p.g = c.g; p.b = c.b; p.st = null; p._rgb = null; }
    const bal = balanceBaseColor();
    for (const p of sand) p.c = (SHAPE === 'balance') ? { r: bal.r, g: bal.g, b: bal.b } : colorByHeight(p.hy);
    if (PARTICLE_STYLE === 'sphere') buildSphereSprites();
  }
  colTop.addEventListener('input', applyColorNow);
  colBot.addEventListener('input', applyColorNow);
  colSolid.addEventListener('input', () => { if (SOLID) applyColorNow(); fwCheckNight(); });
  solidBtn.addEventListener('click', () => {
    SOLID = !SOLID;
    solidBtn.classList.toggle('on', SOLID);
    colorbox.classList.toggle('solid', SOLID);
    applyColorNow();

        // 识别只需手部轮廓，320×240 足够且大幅降低单帧 WASM 推理耗时（高分辨率是卡顿主因之一）；
        //   非 iOS 用 max 硬性封顶防 1080p 撑爆 WASM 堆；iOS Safari 见下方分支，改纯 ideal 软约束。
        video: isIOS ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : { facingMode: 'user', width: { ideal: 320, max: 320 }, height: { ideal: 240, max: 240 }, frameRate: { ideal: 15, max: 30 } },   // iOS 对 max 硬约束常抛 OverconstrainedError → 退到纯 ideal
        audio: false
      }), 8000, '摄像头请求超时');
      handStream = stream;
      if (gen !== handGen || !handEnabled) { abort(); return; }   // 开启途中被关闭：丢弃本次结果
      video.srcObject = stream;
      await withTimeout(video.play(), 8000, '视频启动超时');   // iOS 的 play() 可能永不 settle，包超时避免按钮永远卡住
      if (gen !== handGen || !handEnabled) { abort(); return; }   // play 挂起期间被关闭：不再创建 Hands
      hands = new Hands({ locateFile: f => new URL('mediapipe/' + f, document.baseURI).href });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      hands.onResults(onHandResults);
      gestureBtn.textContent = '手势（加载模型…）'; await withTimeout(hands.send({ image: handVideo }), 45000, '模型加载超时（网络慢）'); if (gen !== handGen || !handEnabled) return; gestureBtn.textContent = '手势'; handSendLoop();   // 网站版：首次 send 触发模型下载，超时/失败要明确告知，不能静默
    } catch (e) {
      if (gen !== handGen || !handEnabled) { abort(); return; }   // 已被关闭/重开接管，不覆盖新状态
      abort();
      handEnabled = false; handBusy = false; handCool = 0;   // 摄像头/权限失败：保留原有划屏切割作兜底
      gestureBtn.classList.remove('on');
      const msg = String(e && e.message || e);
      gestureBtn.textContent = '手势（失败：' + msg.slice(0, 18) + '）';
    }
  }
  function disableGesture() {
    handGen++;                                                       // 让所有在途异步回调立即失效
    if (handTimer) { clearTimeout(handTimer); handTimer = null; }   // 停掉低频识别定时器，避免残留循环继续占算力
    handEnabled = false; fistSeen = false; openSeen = false; handGone = 0; peaceHold = 0; openHold = 0; handBusy = false; handCool = 0;
    if (hands && hands.close) { try { hands.close(); } catch (_) {} }
    hands = null;
    if (handStream) { handStream.getTracks().forEach(t => t.stop()); handStream = null; }
    if (handVideo) { handVideo.remove(); handVideo = null; }
    gestureBtn.classList.remove('on');
    gestureBtn.textContent = '手势';
  }
  gestureBtn.addEventListener('click', () => { handEnabled ? disableGesture() : enableGesture(); });

  // ========== 烟花系统：纯色切黑 → 夜空模式自动绽放 ==========
  const fwCanvas = document.createElement('canvas');
  const fctx = fwCanvas.getContext('2d');
  // 烟花层改为独立 DOM 叠加层（z-index:3 < 工具栏 10）：由浏览器合成，
  // 省掉每帧一次全屏 ctx.drawImage(fwCanvas,0,0,W,H) 的像素拷贝；纯黑底 source-over 视觉等价。
  // 平时 display:none，不参与合成；夜空开启时显示、结束时隐藏并清屏。
  fwCanvas.style.cssText = 'position:fixed;left:0;top:0;z-index:3;pointer-events:none;display:none;';
  document.body.appendChild(fwCanvas);
  function fwResize(){
    if (fwCanvas.width !== W || fwCanvas.height !== H) {
      fwCanvas.width = W; fwCanvas.height = H;
      fwCanvas.style.width = W + 'px'; fwCanvas.style.height = H + 'px';
    }
  }
  fwResize();
  window.addEventListener('resize', fwResize, { passive: true });

  // 基础款：basic 普通 / chrys 菊（移植自参考页，去 bg/trail，用透明层承担）
  const FW = {
    willow:   { group:'basic', count:90,  speedMin:1.4, speedMax:3.8, gravity:0.075, drag:0.985, trailLen:16, lifeMin:100, lifeMax:165, sizeMin:0.9, sizeMax:1.6, colors:[[255,200,90],[255,170,60],[255,222,140]], multi:false },
    gold:     { group:'basic', count:100, speedMin:2,   speedMax:6.5, gravity:0.04,  drag:0.97,  trailLen:12, lifeMin:55,  lifeMax:95,  sizeMin:0.8, sizeMax:1.5, colors:[[255,225,150],[255,200,110]], multi:false },
    minimal:  { group:'basic', count:60,  speedMin:2.5, speedMax:5,   gravity:0.03,  drag:0.95,  trailLen:12, lifeMin:50,  lifeMax:90,  sizeMin:0.6, sizeMax:1.2, colors:[[255,255,255],[210,225,255]], multi:false },
    warm:     { group:'basic', count:90,  speedMin:2,   speedMax:6,   gravity:0.04,  drag:0.97,  trailLen:12, lifeMin:55,  lifeMax:95,  sizeMin:0.8, sizeMax:1.5, colors:[[255,150,170],[255,200,150],[255,180,200]], multi:false },
    cool:     { group:'basic', count:90,  speedMin:2,   speedMax:6,   gravity:0.04,  drag:0.97,  trailLen:12, lifeMin:55,  lifeMax:95,  sizeMin:0.7, sizeMax:1.4, colors:[[90,180,255],[120,220,255],[150,255,200]], multi:false },
    redgold:  { group:'basic', count:110, speedMin:2,   speedMax:6.5, gravity:0.04,  drag:0.97,  trailLen:12, lifeMin:55,  lifeMax:95,  sizeMin:0.8, sizeMax:1.6, colors:[[255,70,70],[255,200,110]], multi:true },
    redgoldWillow:{ group:'basic', count:90, speedMin:1.4, speedMax:3.8, gravity:0.075, drag:0.985, trailLen:16, lifeMin:100, lifeMax:165, sizeMin:0.9, sizeMax:1.6, colors:[[255,90,60],[255,200,110]], multi:true },  // 纯红金柳条：柳条造型(长下垂) + 红金配色(红+金交替)，非纯黄
    violet:   { group:'basic', count:90,  speedMin:2,   speedMax:6,   gravity:0.04,  drag:0.97,  trailLen:12, lifeMin:55,  lifeMax:95,  sizeMin:0.7, sizeMax:1.4, colors:[[180,120,255],[150,90,255],[200,160,255]], multi:false },
    longline: { group:'basic', count:70,  speedMin:2.5, speedMax:5.5, gravity:0.028, drag:0.96,  trailLen:18, lifeMin:70,  lifeMax:120, sizeMin:0.5, sizeMax:1.1, colors:[[255,255,255]], multi:false },
    chrysGold:   { group:'chrys', count:150, layers:[[6.5,8.5],[4,5.5],[2.2,3.2]], gravity:0.04, drag:0.965, trailLen:12, lifeMin:58, lifeMax:105, sizeMin:0.5, sizeMax:1.1, colors:[[255,200,110],[255,225,150]], multi:false, secondary:true, splitChance:0.14 },
    chrysSilver: { group:'chrys', count:150, layers:[[6.5,8.5],[4,5.5],[2.2,3.2]], gravity:0.04, drag:0.965, trailLen:12, lifeMin:58, lifeMax:105, sizeMin:0.5, sizeMax:1.1, colors:[[255,255,255],[210,225,255]], multi:false, secondary:true, splitChance:0.14 },
    // 巨大金银菊（终场专属）：粒子数/绽放半径/尺寸/寿命全面放大，视觉上远超普通菊
    chrysGoldGiant:   { group:'chrys', count:340, layers:[[9.5,12.5],[6,8],[3.5,5]], gravity:0.04, drag:0.965, trailLen:14, lifeMin:85, lifeMax:155, sizeMin:0.9, sizeMax:2.4, colors:[[255,200,110],[255,225,150],[255,255,210]], multi:false, secondary:true, splitChance:0.42 },
    chrysSilverGiant: { group:'chrys', count:340, layers:[[9.5,12.5],[6,8],[3.5,5]], gravity:0.04, drag:0.965, trailLen:14, lifeMin:85, lifeMax:155, sizeMin:0.9, sizeMax:2.4, colors:[[255,255,255],[210,225,255],[230,240,255]], multi:false, secondary:true, splitChance:0.42 }
  };

  const fwRockets = [], fwParts = [];
  const FW_MAX = 3200;
  const fwRnd = (a,b)=> a + Math.random()*(b-a);
  const fwPick = a => a[(Math.random()*a.length)|0];

  // 两类概率（普通 60% / 金银菊 40%）+ 各类内部组合数量概率
  function pickCombo(){
    const r = Math.random();
    let pool, nMax, singleP, doubleP;
    if(r < 0.60){
      pool=['willow','gold','minimal','warm','cool','redgold','violet','longline']; singleP=0.45; doubleP=0.40; nMax=3;
    }
    else { pool=['chrysGold','chrysSilver']; singleP=0.40; doubleP=0.60; nMax=2; }  // 菊：双色(金+银)比例高
    const rr = Math.random();
    let n = 1;
    if(nMax>=3 && rr>singleP+doubleP) n = 3;
    else if(rr>singleP) n = 2;
    const combo = [], tmp = pool.slice();   // 随机 n 个不重复基础款叠加（共享爆炸中心 → 多色组合）
    while(combo.length<n && tmp.length) combo.push(tmp.splice((Math.random()*tmp.length)|0,1)[0]);
    return combo;
  }

  function fwLaunch(combo, center){
    const first = FW[combo[0]];
    const sx = center ? W*0.5 : fwRnd(W*0.15, W*0.85);     // 巨大金银菊居中释放，普通烟花随机
    const ty = center ? H*0.45 : fwRnd(H*0.12, H*0.45);
    // 巨大金银菊(center)火箭上升速度放慢（释放速度放慢），普通烟花保持原速
    const vy = center ? -fwRnd(7,9) : -fwRnd(9,12.5);
    const color = fwPick(first.colors);
    fwRockets.push({ x:sx, y:H+8, vx:fwRnd(-1,1), vy, ty, css:`rgb(${color[0]},${color[1]},${color[2]})`, hist:[], combo });
  }

  function fwExplode(x, y, combo){
    for(const key of combo){
      const s = FW[key];
      const baseColor = fwPick(s.colors);
      const n = s.count;
      for(let i=0;i<n;i++){
        let ang, sp;
        if(s.ring){ ang=(i/n)*Math.PI*2; sp=(s.speedMin+s.speedMax)/2; }
        else if(s.layers){ const L=fwPick(s.layers); ang=fwRnd(0,Math.PI*2); sp=fwRnd(L[0],L[1]); }
        else { ang=fwRnd(0,Math.PI*2); sp=fwRnd(s.speedMin,s.speedMax); }
        const color = s.multi ? fwPick(s.colors) : baseColor;
        const life = fwRnd(s.lifeMin, s.lifeMax);
        const canSplit = !!(s.secondary && Math.random() < (s.splitChance||0.14));
        fwParts.push({ x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life, maxLife:life, css:`rgb(${color[0]},${color[1]},${color[2]})`, size:fwRnd(s.sizeMin,s.sizeMax), flick:Math.random()<0.30, split:canSplit, splitLife:canSplit?life*fwRnd(0.42,0.58):0, didSplit:false, hist:[], comet:!!s.comet, trailLen:s.trailLen||12, gravity:s.gravity, drag:s.drag });
      }
    }
  }

  function fwDrawTrail(hist, col, width, alpha){
    const n = hist.length;
    fctx.globalAlpha = alpha;
    fctx.strokeStyle = col; fctx.fillStyle = col;
    fctx.lineCap='round'; fctx.lineJoin='round';
    if(n<2){ if(n===1){ if(hist[0].comet) fwDrawHead(hist[0],width,col,alpha); else { fctx.beginPath(); fctx.arc(hist[0].x,hist[0].y,width,0,7); fctx.fill(); } } return; }
    if(hist[0].comet){
      for(let k=0;k<n-1;k++){ const t=1-k/(n-1); fctx.lineWidth=Math.max(0.6, width*(0.12+1.0*t)); fctx.beginPath(); fctx.moveTo(hist[k].x,hist[k].y); fctx.lineTo(hist[k+1].x,hist[k+1].y); fctx.stroke(); }
      fwDrawHead(hist[0],width,col,alpha);
    } else { fctx.lineWidth=width; fctx.beginPath(); fctx.moveTo(hist[0].x,hist[0].y); for(let k=1;k<n;k++) fctx.lineTo(hist[k].x,hist[k].y); fctx.stroke(); }
  }
  function fwDrawHead(h, w, col, a){ fctx.globalAlpha=a; fctx.fillStyle=col; fctx.beginPath(); fctx.ellipse(h.x,h.y,w*1.3,w*0.9,0,0,7); fctx.fill(); }

  let fwActive = false, fwDt = 1;   // fwDt：帧时间归一化系数，直接采用真实帧间隔 dt → 烟花按设备原生刷新率实时播放（手机多少 Hz 就跑多少 Hz）
  function fwUpdateDraw(){
    fctx.clearRect(0,0,W,H);
    fctx.globalCompositeOperation='lighter';
    for(let i=fwRockets.length-1;i>=0;i--){
      const r=fwRockets[i]; r.vy+=0.14*fwDt; r.x+=r.vx*fwDt; r.y+=r.vy*fwDt;
      const maxHist=Math.max(4,Math.round(6/fwDt));
      const pt=r.hist.length>=maxHist?r.hist.pop():{};
      pt.x=r.x; pt.y=r.y; pt.comet=false; r.hist.unshift(pt);
      fwDrawTrail(r.hist, r.css, 1.6, 1);
      if(r.vy>=-1.2 || r.y<=r.ty){ fwExplode(r.x,r.y,r.combo); fwRockets.splice(i,1); }
    }
    for(let i=fwParts.length-1;i>=0;i--){
      const p=fwParts[i];
      const _dr=Math.pow(p.drag,fwDt); p.vx*=_dr; p.vy*=_dr; p.vy+=p.gravity*fwDt; p.x+=p.vx*fwDt; p.y+=p.vy*fwDt;
      if(p.split && !p.didSplit && p.life<=p.splitLife){
        const fn=5+(Math.random()*4|0);
        for(let j=0;j<fn;j++){ const a2=fwRnd(0,Math.PI*2), s2=fwRnd(1,2.6), l2=fwRnd(30,52); fwParts.push({x:p.x,y:p.y,vx:Math.cos(a2)*s2,vy:Math.sin(a2)*s2,life:l2,maxLife:l2,css:p.css,size:fwRnd(0.4,0.9),flick:true,split:false,didSplit:false,hist:[],comet:p.comet,trailLen:p.trailLen,gravity:0.05,drag:0.95}); }
        p.didSplit=true; fwParts.splice(i,1); continue;
      }
      p.life-=fwDt; if(p.life<=0){ fwParts.splice(i,1); continue; }
      const maxHist=Math.max(4,Math.round(p.trailLen/fwDt));
      const pt=p.hist.length>=maxHist?p.hist.pop():{};
      pt.x=p.x; pt.y=p.y; pt.comet=p.comet; p.hist.unshift(pt);
      let a=p.life/p.maxLife; if(p.flick && a<0.6) a*=(0.35+Math.random()*0.65);
      fwDrawTrail(p.hist, p.css, p.size, a);
    }
    if(fwParts.length>FW_MAX) fwParts.splice(0, fwParts.length-FW_MAX);
    fctx.globalCompositeOperation='source-over'; fctx.globalAlpha=1;
  }

  function fwAutoFire(){
    if(!fwActive || fwPhase !== 1) return;        // 仅普通阶段发射；进入终场巨大金银菊阶段后自动停（期间禁其它烟花）
    const burst = 1 + (Math.random() < 0.55 ? 1 : 0);
    for(let k=0;k<burst;k++) fwLaunch(pickCombo());
    fwAutoTimer = setTimeout(fwAutoFire, fwRnd(350, 700));
  }

  let fwAutoReform = false, fwPhase = 0, fwAutoTimer = null, fwGiantTimer = null;

  // 颜色复位为初始（白顶粉底渐变）：关掉纯色、清 colorTouched，所有在场粒子/球型贴图同步
  function resetInitialColor(){
    if (SOLID) { SOLID = false; solidBtn.classList.remove('on'); colorbox.classList.remove('solid'); }
    colorTouched = false;
    for (const p of heart) { const c = shapeColor(p.hy, p.idx); p.r = c.r; p.g = c.g; p.b = c.b; p.st = null; p._rgb = null; }
    if (PARTICLE_STYLE === 'sphere') buildSphereSprites();
  }

  // 夜空结束：停发烟花 → 颜色复位为初始 → 自动切割 → 置位「落定后自动重聚」
  function endNight(){
    if (!fwActive) return;
    fwActive = false; fwPhase = 0;
    fwCanvas.style.display = 'none'; fctx.clearRect(0, 0, W, H);
    if (fwGiantTimer) { clearTimeout(fwGiantTimer); fwGiantTimer = null; }
    if (fwAutoTimer) { clearTimeout(fwAutoTimer); fwAutoTimer = null; }
    fwRockets.length = 0; fwParts.length = 0;          // 清场，干净交接到爱心切割
    resetInitialColor();
    if (!scattered && heartReady) { scatter(0, 0); fwAutoReform = true; }   // 自动切割，随后自动重聚
  }

  // 终场巨大金银菊：普通烟花放约 16s 后触发，单独释放一朵巨型金/银菊，期间禁止其它烟花；
  //   其升空+绽放约 5s 后由 endNight 收尾（自动切割爱心），实现「只有释放完巨大金银菊才可切割」。
  function startGiant(){
    if(!fwActive || fwPhase !== 1) return;
    fwPhase = 2;                                       // 进入终场阶段
    if(fwAutoTimer){ clearTimeout(fwAutoTimer); fwAutoTimer = null; }          // 停掉普通烟花连发
    if(fwGiantTimer){ clearTimeout(fwGiantTimer); fwGiantTimer = null; }
    const big = Math.random() < 0.5 ? 'chrysGoldGiant' : 'chrysSilverGiant';  // 随机金菊或银菊
    fwLaunch([big], true);                             // 单独释放一朵巨大金银菊（屏幕正中央）
    fwGiantPoll();                                    // 轮询：升空+绽放+花瓣分裂的小烟花全部消失后才允许切割
  }
  // 终场轮询：巨大金银菊升空→绽放→花瓣分裂的小烟花彻底释放完（fwRockets/fwParts 皆空）→ 才结束并切割爱心
  function fwGiantPoll(){
    if(!fwActive || fwPhase !== 2) return;            // 已结束或异常 → 退出
    if(fwRockets.length === 0 && fwParts.length === 0){ endNight(); return; }  // 全部放完（含小烟花）→ 才开始切割
    fwGiantTimer = setTimeout(fwGiantPoll, 250);       // 否则继续等（每 250ms 检查一次）
  }
  // 颜色切黑 → 夜空模式：SOLID（纯色模式）且纯色接近黑时开启，否则关闭
  function fwCheckNight(){
    const on = SOLID && Math.max(COL_SOLID.r, COL_SOLID.g, COL_SOLID.b) < 28;
    if (on && !fwActive) {
      fwActive = true; fwPhase = 1;                    // 普通烟花阶段
      fwCanvas.style.display = 'block';
      if (fwGiantTimer) { clearTimeout(fwGiantTimer); fwGiantTimer = null; }
      fwAutoFire();
      fwGiantTimer = setTimeout(startGiant, 16000);    // 约 16s 普通烟花后放巨大金银菊；总时长≈21s
    } else if (!on && fwActive) {
      endNight();                                      // 手动切回非黑：提前结束（主动退出，属例外）
    }
  }
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var panel=document.getElementById('panel');
  if(!panel) return;
  var modal=document.createElement('div');
  modal.id='licModal';
  modal.style.cssText='display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,.94);padding:12px;box-sizing:border-box;';
  var box=document.createElement('div');
  box.style.cssText='display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto;background:#15161a;border:1px solid #33343b;border-radius:12px;overflow:hidden;';
  var bar=document.createElement('div');
  bar.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2a2c33;color:#e8e8ec;font:14px system-ui,sans-serif;';
  bar.appendChild(document.createTextNode('第三方开源许可声明'));
  var close=document.createElement('button');
  close.id='licClose'; close.type='button'; close.textContent='关闭';
  close.style.cssText='font:13px system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:16px;cursor:pointer;';
  bar.appendChild(close); box.appendChild(bar);
  var frame=document.createElement('iframe');
  frame.id='licFrame'; frame.setAttribute('title','开源许可');
  frame.style.cssText='flex:1;width:100%;border:0;background:#15161a;';

<script>
/* 工具栏布局：小爱心收纳 + 「按钮散落」开关（切换回未收纳前的平铺布局） */
(function(){
  var panel=document.getElementById('panel');
  if(!panel || document.getElementById('hubBtn')) return;
  var colorbox=document.getElementById('colorbox');
  var drawer=document.createElement('div');
  drawer.id='hubDrawer';
  drawer.setAttribute('aria-hidden','true');
  var hub=document.createElement('button');
  hub.id='hubBtn'; hub.type='button';
  hub.title='展开工具栏'; hub.setAttribute('aria-label','展开工具栏');
  hub.innerHTML="<svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path fill='#ff86b6' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>";
  var scatter=document.createElement('button');
  scatter.id='hubScatterBtn'; scatter.type='button';
  var scatterOn=false;
  scatter.textContent='按钮散落';
  scatter.title='把按钮散落到屏幕上方（恢复原版工具栏）';
  /* 先把原有控件（调色板除外）移进抽屉，节点本身移动，事件绑定不丢 */
  var move=[];
  Array.prototype.slice.call(panel.children).forEach(function(el){
    if(el.id!=='colorbox') move.push(el);
  });
  move.forEach(function(el){ drawer.appendChild(el); });
  drawer.appendChild(scatter);
  panel.insertBefore(hub, panel.firstChild);
  panel.insertBefore(drawer, hub.nextSibling);

  function setDrawer(open){
    drawer.style.display = open ? 'flex' : 'none';
    drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
    hub.classList.toggle('on', open);
    hub.title = open ? '收起工具栏' : '展开工具栏';
    hub.setAttribute('aria-label', hub.title);
  }
  hub.addEventListener('click',function(e){
    if(e&&e.stopPropagation) e.stopPropagation();
    setDrawer(drawer.style.display!=='flex');
  });

  /* on=true 按钮散落：抽屉内全部控件（含本开关）移回 #panel，插在调色板之前，
     隐藏小爱心与抽屉 —— 按钮平铺在屏幕上方，与收纳功能加入之前完全一致。
     on=false 收纳：把 #panel 里除 hub / drawer / colorbox 外的控件移回抽屉。 */
  function setScatter(on){
    scatterOn = on;
    try{ localStorage.setItem('heartToolbarScatter', on?'1':'0'); }catch(e){}
    if(on){
      Array.prototype.slice.call(drawer.children).forEach(function(el){
        panel.insertBefore(el, colorbox);
      });
      setDrawer(false);
      hub.style.display='none';
      scatter.textContent='按钮收纳';
      scatter.title='收回工具栏（恢复小爱心按钮）';
      scatter.classList.add('on');
    }else{
      Array.prototype.slice.call(panel.children).forEach(function(el){
        if(el!==hub && el!==drawer && el.id!=='colorbox') drawer.appendChild(el);
      });
      hub.style.display='';
      setDrawer(false);
      scatter.textContent='按钮散落';
      scatter.title='把按钮散落到屏幕上方（恢复原版工具栏）';
      scatter.classList.remove('on');
    }
  }
  scatter.addEventListener('click',function(e){
    if(e&&e.stopPropagation) e.stopPropagation();
    setScatter(!scatterOn);
  });
  /* 记住上次选择；全新安装默认收纳 */
  try{ if(localStorage.getItem('heartToolbarScatter')==='1') setScatter(true); }catch(e){}
})();
</script>
